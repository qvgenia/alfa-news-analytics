services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: alfa_hack
      POSTGRES_USER: alfa_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa_app -d alfa_hack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
